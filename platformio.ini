; ╔══════════════════════════════════════════════════════════════╗
; ║   Умная теплица ESP32  —  PlatformIO configuration           ║
; ║                                                              ║
; ║   ВЕРСИЯ ПРОШИВКИ ЗДЕСЬ НЕ ХРАНИТСЯ.                         ║
; ║   Единственный источник — FW_VERSION_MAJOR / FW_VERSION_MINOR║
; ║   в include/config.h.                                        ║
; ║                                                              ║
; ║   Порядок прошивки (первый раз или при смене таблицы         ║
; ║   разделов — только по USB, веб-OTA новую таблицу не может): ║
; ║     1. Tasks → Upload Filesystem Image   (LittleFS / data/)  ║
; ║     2. Tasks → Upload                    (firmware)          ║
; ║   При обновлении только кода — достаточно шага 2.            ║
; ║   Если менялись файлы в data/ — обязателен и шаг 1.          ║
; ╚══════════════════════════════════════════════════════════════╝

; Без этой секции «pio run» и кнопка Build собирали БЫ оба окружения
; (USB и OTA) — вдвое дольше на каждой сборке. Сетевое окружение
; вызывается явно: pio run -e ota -t upload
[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform               = espressif32 @ ~6.9.0    ; стабильная версия, Arduino core 2.0.17
board                  = esp32doit-devkit-v1
framework              = arduino
board_build.filesystem = littlefs

; ── Схема партиций (кастомная) ────────────────────────────────
; Стандартные не подходят: default.csv даёт всего ~1.2 МБ на
; приложение, а min_spiffs.csv — около 190 КБ на файловую систему,
; чего не хватает для index.html + app.js + style.css + шрифта + GIF.
;
; Фактические размеры:
;   app0 / app1 — по 0x1B0000 = 1728 КБ  (две партиции под OTA)
;   spiffs      —    0x90000 =  576 КБ  (LittleFS, каталог data/)
board_build.partitions = partitions_greenhouse.csv

; ── Порт ──────────────────────────────────────────────────────
; upload_port / monitor_port НЕ задаём: PlatformIO определяет порт
; сам. Если портов несколько и выбирается не тот —
; раскомментируйте и укажите свой:
; upload_port  = COM3
; monitor_port = COM3
upload_speed   = 921600
monitor_speed  = 115200

; esp32_exception_decoder превращает адреса в аварийном дампе в
; имена функций и номера строк. Вместе с расшифровкой причины
; сброса (см. resetReasonStr в main.cpp) это главный инструмент
; разбора перезагрузок — не убирать.
monitor_filters = esp32_exception_decoder, colorize

; ── Автосборка OTA-контейнера ─────────────────────────────────
; После сборки прошивки скрипт читает FW_VERSION_MAJOR/MINOR из
; include/config.h и упаковывает greenhouse_vX.Y.bin. Версию
; руками нигде вводить не нужно — она не разъедется с config.h.
extra_scripts = post:tools/build_container.py

; ── Зависимости ────────────────────────────────────────────────
; Убрано из v4:
;   • arduino-libraries/NTPClient — заменили на нативный esp_sntp
;
; Оставлено:
;   • ESPAsyncWebServer/AsyncTCP — основа веб-сервера + WebSocket
;   • Adafruit BME280 — проверенный драйвер I²C датчика
;   • DHT sensor library — для DHT22 (вариант с RMT пока избыточен)
;   • BH1750 — для GY-30 датчика освещённости
;   • ArduinoJson v7 — только новый JsonDocument API
;   • PubSubClient — MQTT клиент
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP          @ ^3.3.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/DHT sensor library     @ ^1.4.6
    claws/BH1750                    @ ^1.3.0
    bblanchon/ArduinoJson           @ ^7.3.0
    knolleary/PubSubClient          @ ^2.8

; ── Флаги сборки ──────────────────────────────────────────────
;
build_flags =
    ; ── Распределение по ядрам ────────────────────────────────────
    ; По умолчанию у AsyncTCP RUNNING_CORE = -1, то есть его задача
    ; не закреплена и может оказаться на любом ядре. Приоритет у неё 10,
    ; а у управляющего цикла taskCore1 — всего 2. Попав на ядро 1,
    ; AsyncTCP вытесняет управление реле и опрос датчиков; заметнее всего
    ; это при обновлении по воздуху, где обработчик пишет флеш.
    ;
    ; Закрепляем сеть за ядром 0, где уже живут Wi-Fi и LWIP. Ядро 1
    ; остаётся за прикладной логикой: taskCore1 и loopTask.
    ; Для управляющего устройства предсказуемость цикла важнее
    ; отзывчивости веб-интерфейса.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0

    ; Adafruit_BME280 использует устаревший API Wire — глушим шум
    -Wno-deprecated-declarations

    ; Arduino-ESP32 по умолчанию собирает с -Os. Здесь осознанно
    ; -O2: скорость важнее, места во flash хватает с запасом.
    -O2

    ; Уровень логов ядра (раскомментировать для отладки)
    ; -D CORE_DEBUG_LEVEL=4

; ═══════════════════════════════════════════════════════════════
;  Прошивка по сети (ArduinoOTA)
; ═══════════════════════════════════════════════════════════════
; Работает начиная с v6.1 —
; Пароль берётся из учётных данных веб-панели (NetMgr::cache().webPass),
; отдельно его нигде задавать не нужно и в репозиторий он не попадает.
;
; XXXXXX — последние три байта MAC, устройство печатает своё имя
; в Serial при старте: «ArduinoOTA started (mDNS: greenhouse-XXXXXX.local)».
;
; Использование:  pio run -e ota -t upload
;
; ВНИМАНИЕ: этот канал шьёт ТОЛЬКО прошивку. Файлы из data/
; он не обновляет — для них Upload Filesystem Image по USB
; либо веб-OTA контейнером greenhouse_vX.Y.bin.
[env:ota]
extends       = env:esp32doit-devkit-v1
upload_protocol = espota
upload_port   = greenhouse-XXXXXX.local
upload_flags  =
    --auth=ВАШ_ПАРОЛЬ_ВЕБ_ПАНЕЛИ
