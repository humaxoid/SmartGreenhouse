<main>
<h1>SMART GREENHOUSE — распиновка ESP32 DOIT DEVKIT V1 (v2)</h1>
<p class="sub">По include/config.h: реле 8 кан. + отдельное реле насоса, BME280+GY-30 (I²C), DHT22, YL-83, AJ-SR04M, 5 кнопок. Soil Moisture Sensor и DS18B20 убраны.</p>
<div class="legend">
<span><i style="background:var(--teal)"></i>GPIO задействован</span>
<span><i style="background:var(--grey)"></i>не используется</span>
<span><i style="background:var(--red)"></i>питание</span>
<span><i style="background:var(--dark)"></i>GND</span>
<span><i style="background:var(--relaypcb)"></i>реле</span>
<span><i style="background:var(--btncap)"></i>кнопка</span>
</div>
